import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.dokka'
apply plugin: 'maven-publish'
apply plugin: 'signing'

buildscript {
    repositories {
        mavenCentral()
    }
}

repositories {
    google()
    mavenCentral()
}

android {
    compileSdk androidCompileSdkVersion
    testOptions.unitTests.includeAndroidResources = true
    testOptions {
        targetSdk 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }

    defaultConfig {
        minSdkVersion androidMinSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.motorro.appupdatewrapper'

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
    lint {
        targetSdk 37
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    api 'androidx.core:core-ktx:1.19.0'
    api 'androidx.lifecycle:lifecycle-common:2.11.0'
    api 'androidx.activity:activity-ktx:1.13.0'
    api 'com.google.android.play:app-update:2.1.0'
    api 'com.google.android.play:app-update-ktx:2.1.0'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation project(":testapp")
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation 'com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.lifecycle:lifecycle-runtime-testing:2.11.0'
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.dokkaGenerate
    group = 'documentation'
    archiveClassifier.set('javadoc')
    from tasks.dokkaGenerate
}

def libId = 'appupdatewrapper'
def libName = 'appupdatewrapper'
def libDesc = 'A wrapper for Android `AppUpdateManager` to encapsulate update workflow.'


afterEvaluate {

    signing {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }

    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = rootProject.group
                artifactId = libId
                version = rootProject.version

                pom {
                    name = libName
                    description = libDesc
                    url = projectUrl
                    licenses {
                        license {
                            name = 'Apache-2.0'
                            url = 'https://apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    developers {
                        developer {
                            id = developerId
                            name = developerName
                            email = developerEmail
                        }
                    }
                    scm {
                        connection = projectScm
                        developerConnection = projectScm
                        url = projectUrl
                    }
                }
            }
        }
    }
}
