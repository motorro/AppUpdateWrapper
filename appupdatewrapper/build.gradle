import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.dokka)
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdk libs.versions.compileSdk.get().toInteger()
    testOptions.unitTests.includeAndroidResources = true
    testOptions {
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            languageVersion = KotlinVersion.KOTLIN_2_0
        }
    }

    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.motorro.appupdatewrapper'

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
    lint {
        targetSdk libs.versions.targetSdk.get().toInteger()
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api libs.androidx.core.ktx
    api libs.androidx.lifecycle.common
    api libs.androidx.activity.ktx
    api libs.play.app.update
    api libs.play.app.update.ktx

    implementation libs.timber

    testImplementation project(":testapp")
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.junit
    testImplementation libs.kotlin.test
    testImplementation libs.mockito.kotlin
    testImplementation libs.robolectric
    testImplementation libs.androidx.lifecycle.runtime.testing
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.dokkaGenerate
    group = 'documentation'
    archiveClassifier.set('javadoc')
    from tasks.dokkaGenerate
}

def libId = 'appupdatewrapper'
def libName = 'appupdatewrapper'
def libDesc = 'A wrapper for Android `AppUpdateManager` to encapsulate update workflow.'


afterEvaluate {

    signing {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }

    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = rootProject.group
                artifactId = libId
                version = rootProject.version

                pom {
                    name = libName
                    description = libDesc
                    url = projectUrl
                    licenses {
                        license {
                            name = 'Apache-2.0'
                            url = 'https://apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    developers {
                        developer {
                            id = developerId
                            name = developerName
                            email = developerEmail
                        }
                    }
                    scm {
                        connection = projectScm
                        developerConnection = projectScm
                        url = projectUrl
                    }
                }
            }
        }
    }
}
